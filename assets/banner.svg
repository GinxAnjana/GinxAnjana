<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Gihan Anjana - AI and ML Engineer, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0205"/>
      <stop offset="0.55" stop-color="#2a0610"/>
      <stop offset="1" stop-color="#5a1208"/>
    </linearGradient>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff3d1f"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3d1f"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff8a3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ff5a1f" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b">
        <animate attributeName="stdDeviation" values="3;9;3" dur="3.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="250" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="700" dur="3s" begin="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <circle cx="180" cy="80" r="170" fill="url(#glowA)">
    <animate attributeName="r" values="150;200;150" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="230" r="190" fill="url(#glowA)">
    <animate attributeName="r" values="200;150;200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#ff5a1f" stroke-linecap="round">
    <circle cx="1070" cy="150" r="88" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 14">
      <animateTransform attributeName="transform" type="rotate" from="0 1070 150" to="360 1070 150" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="150" r="62" stroke="#ffb347" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="30 20">
      <animateTransform attributeName="transform" type="rotate" from="360 1070 150" to="0 1070 150" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="150" r="88" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 14">
      <animateTransform attributeName="transform" type="rotate" from="360 130 150" to="0 130 150" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="150" r="62" stroke="#ffb347" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="30 20">
      <animateTransform attributeName="transform" type="rotate" from="0 130 150" to="360 130 150" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#ff8a3d">
    <circle cx="1070" cy="150" r="6"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="150" r="6"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#ff8a3d">
    <circle cx="90" cy="310" r="2" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="310" r="3" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="310" r="2" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="310" r="2.5" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="310" r="1.5" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="310" r="3" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="11s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="11s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="310" r="2" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="7s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="7s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="310" r="2.5" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="310" r="2" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="6s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="310" r="3" opacity="0"><animate attributeName="cy" from="310" to="-10" dur="10s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" dur="10s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="-80" y="0" width="80" height="300" fill="url(#scan)">
    <animate attributeName="x" from="-80" to="1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#ffd9b8">
    <circle cx="920" cy="38" r="5" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="934" y="43" letter-spacing="2">AVAILABLE FOR WORK</text>
    <text x="40" y="43" fill="#ff8a3d" letter-spacing="2">&lt;/&gt; GIHAN.DEV</text>
  </g>

  <g filter="url(#glow)">
    <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="url(#nameGrad)" textLength="780" lengthAdjust="spacing" opacity="0">
      GIHAN ANJANA
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
    </text>
  </g>

  <rect x="600" y="172" width="0" height="4" rx="2" fill="url(#borderGrad)">
    <animate attributeName="width" from="0" to="560" dur="1s" begin="1s" fill="freeze"/>
    <animate attributeName="x" from="600" to="320" dur="1s" begin="1s" fill="freeze"/>
  </rect>

  <g clip-path="url(#typeClip)">
    <text x="250" y="232" font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700" fill="#ffe3cc" textLength="700" lengthAdjust="spacing">AI &amp; ML ENGINEER  •  FULL-STACK DEVELOPER</text>
  </g>
  <rect x="250" y="210" width="3" height="28" fill="#ff8a3d">
    <animate attributeName="x" from="250" to="950" dur="3s" begin="1.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <rect x="2" y="2" width="1196" height="296" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" stroke-dasharray="260 140" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-1200" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
