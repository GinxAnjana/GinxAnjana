<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd9b8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)" opacity="0.6"/>
  <rect x="-200" y="10" width="200" height="4" rx="2" fill="url(#pulse)">
    <animate attributeName="x" from="-200" to="1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(600 12)">
    <rect x="-6" y="-6" width="12" height="12" fill="#ff5a1f" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;225;405" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
